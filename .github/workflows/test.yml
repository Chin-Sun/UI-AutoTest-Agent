name: check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 端到端测试用真实浏览器
      - run: pnpm --filter @uta/runner exec playwright install --with-deps chromium
      - run: pnpm lint
      - run: pnpm typecheck
      # 单元测试 + 端到端测试；结束后校验测试数据是否清理干净
      - run: pnpm test
