<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>动态文件选择器</title></head>
<body>
  <!-- 和 MolarData 导入卡片一样：点击后才临时创建 input 并唤起系统文件选择器，页面里没有 input 可定位 -->
  <div class="card" id="pick" style="display:inline-block;padding:8px;border:1px solid #333;cursor:pointer">文件</div>
  <p data-testid="picked"></p>
  <script>
    document.getElementById('pick').addEventListener('click', () => {
      const input = document.createElement('input')
      input.type = 'file'
      input.multiple = true
      input.onchange = () => {
        document.querySelector('[data-testid="picked"]').textContent = [...input.files].map((file) => file.name).join(',')
      }
      input.click()
    })
  </script>
</body>
</html>
