<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>div 按钮 + 协议勾选 + 重复登录弹窗</title></head>
<body>
  <div class="login-wrap">
    <div class="tabs"><span>密码登录</span></div>
    <input class="u" placeholder="手机号 / 邮箱">
    <input class="p" type="password" placeholder="密码">
    <div role="checkbox" aria-checked="false" aria-labelledby="policy-label" id="policy" tabindex="0" style="display:inline-flex;align-items:center;gap:6px;cursor:pointer">
      <span style="display:inline-block;width:14px;height:14px;border:1px solid #333"></span>
      <span id="policy-label">我已阅读并接受<a href="#" id="userPolicy">用户协议</a>和隐私政策</span>
    </div>
    <div class="button" style="margin-top:8px;cursor:pointer">登录</div>
    <div id="toast" role="alert"></div>
  </div>
  <div class="pop-container" hidden>
    <div class="footer"><div class="button second">取消</div><div class="button">确认</div></div>
  </div>
  <script>
    const params = new URLSearchParams(location.search)
    const policy = document.getElementById('policy')
    policy.addEventListener('click', () => policy.setAttribute('aria-checked', policy.getAttribute('aria-checked') === 'true' ? 'false' : 'true'))
    // 点协议链接不会切换勾选（和真实平台一致）
    document.getElementById('userPolicy').addEventListener('click', (event) => {
      event.preventDefault()
      event.stopPropagation()
    })
    const finish = () => {
      localStorage.setItem('TOKEN', 'token-div')
      location.href = 'home.html'
    }
    document.querySelector('.login-wrap .button').addEventListener('click', async () => {
      if (policy.getAttribute('aria-checked') !== 'true') {
        document.getElementById('toast').textContent = '请先同意用户协议'
        return
      }
      if (document.querySelector('.p').value !== 'secret') {
        document.getElementById('toast').textContent = '密码错误'
        return
      }
      if (params.has('precheck')) {
        await fetch('api/validate-login')
        return
      }
      if (params.has('repeat')) {
        setTimeout(() => { document.querySelector('.pop-container').hidden = false }, 400)
        return
      }
      finish()
    })
    document.querySelector('.pop-container .button:not(.second)').addEventListener('click', finish)
  </script>
</body>
</html>
